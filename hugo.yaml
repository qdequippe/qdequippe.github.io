baseURL: https://dequippe.tech
languageCode: "fr-FR"
title: "Quentin Dequippe"
enableEmoji: true
defaultContentLanguage: fr
enableRobotsTXT: true
theme: ["PaperMod"]

params:
    displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: true
    profileMode:
        enabled: true
        title: "Hello 👋"

    socialIcons:
        - name: email
          url: "mailto:quentin@dequippe.tech"
        - name: github
          url: "https://github.com/qdequippe"
        - name: linkedin
          url: "https://www.linkedin.com/in/qdequippe"
        - name: stackoverflow
          url: "https://stackoverflow.com/users/10353962/qdequippe"

languages:
    fr:
        languageName: Français
        languageCode: fr-FR
        weight: 1
        menu:
            main:
                - identifier: blog
                  name: Blog
                  url: https://blog.dequippe.tech
                  weight: 10
                - identifier: resume
                  name: CV
                  url: https://dequippe.tech/resume/quentin_dequippe_resume.pdf
        params:
            description: "Consultant & référent technique web"
            profileMode:
                subtitle: "Je suis Quentin Dequippe, consultant & référent technique web"
    en:
        languageName: English
        weight: 2
        languageCode: en-US
        menu:
            main:
                - identifier: blog
                  name: Blog
                  url: https://blog.dequippe.tech
                  weight: 10
                - identifier: resume
                  name: Resume
                  url: https://dequippe.tech/resume/quentin_dequippe_resume.en.pdf
        params:
            description: "Web consultant & technical lead"
            profileMode:
                subtitle: " I'm Quentin Dequippe, web consultant & technical lead"
